[project]
name = "kind"
version = "0.3.0"
description = "Interned, name-identified Kinds: categories as data, in a lazy, graph-oriented, freezable model"
dependencies = [
    "orjson>=3.10.0",
    "anyio>=4.4.0",
    "PyYAML",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme="docs/package/README.md"

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Operating System :: OS Independent",
]

authors = [
  {name = "Miklos Beky", email = "miklos.beky@gmail.com"},
]

[project.urls]
homepage = "https://github.com/ikko/kind"
repository = "https://github.com/ikko/kind"
documentation = "https://github.com/ikko/kind"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kind*"]

[tool.setuptools.package-data]
"kind" = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "trio",
    "pyflakes",
    "hypothesis",
    "mypy",
    "types-PyYAML",
    "tomli",
    "bandit",
]
visual = [
    "graphviz>=0.20.0",
]
full = [
    "kind[visual]",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["graphviz", "croniter"]
ignore_missing_imports = true

[tool.bandit]
# B101 (assert): asserts here state internal invariants and narrow types for mypy; they guard nothing
# security-relevant, so stripping them under -O changes no security property.
skips = ["B101"]
