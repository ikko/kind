name: Publish Package

# PyPI Trusted Publishing: no stored password. One-time setup on pypi.org:
# project "kind" -> Publishing -> add a GitHub publisher (owner ikko, repo kind,
# workflow publish_package.yml, environment production).
# Manual only: nothing goes to PyPI until kind has proven itself in a few projects
# (decision 2026-10-02). It would also fail: the `Private :: Do Not Upload`
# classifier in pyproject.toml makes PyPI refuse the upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Build
        run: |
          pip install uv
          uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
